<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>日迹 · 打卡</title>

<!-- ================= PWA 相关 ================= -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#C7BCA6">
<meta name="description" content="记录每天的心情、体重与日常打卡">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日迹">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<!-- ============================================ -->

<!-- lunar-javascript：农历转换、节气、节日 -->
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@2.0.4/dist/lunar.min.js"></script>
<style>
:root{
  --paper:#FDFBF6;
  --paper-line:#EFE9DC;
  --ink:#33302B;
  --ink2:#6E685D;
  --ink3:#A29A8B;
  --line:#E6E0D2;
  --accent:#C96B4A;
  --accent-soft:#F9ECE5;
  --up:#C0554B;
  --down:#4C8B7A;
  --festival:#C0554B;
  --term:#4C8B7A;
  --font-serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background-color:#C7BCA6;
  background-image:
    radial-gradient(circle at 50% 0%, rgba(255,255,255,.20), transparent 55%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 2px, transparent 2px 4px);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
#app{
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  overflow-x:hidden;
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
  background-color:var(--paper);
  background-image:repeating-linear-gradient(180deg,transparent 0,transparent 27px,var(--paper-line) 27px,var(--paper-line) 28px);
  box-shadow:0 0 60px rgba(0,0,0,.13);
}
#app::before{
  content:'';
  position:absolute;
  left:8px;top:0;bottom:0;
  width:1.5px;
  background:#E7B1B1;
  opacity:.55;
  z-index:0;
  pointer-events:none;
}
.page{
  padding:0 16px 0 22px;
  position:relative;
  z-index:1;
  padding-top:env(safe-area-inset-top);
}
button{font-family:inherit;border:none;background:none;padding:0;cursor:pointer;color:inherit;}
input,textarea{font-family:inherit;}

/* ---------- 顶栏 ---------- */
.appbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 2px 13px;gap:8px;
  border-bottom:1px solid var(--line);
  position:relative;
}
.appbar::after{
  content:'';position:absolute;left:0;right:0;bottom:-4px;height:1px;
  background:var(--line);opacity:.5;
}
.brand{
  font-family:var(--font-serif);
  font-size:21px;font-weight:700;letter-spacing:3px;
}
.brand::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:7px;}
.icon-btn{
  width:38px;height:38px;border-radius:10px;
  background:#FFFDFA;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink2);flex:none;
  transition:.15s;
}
.icon-btn:active{background:#F4EFE3;color:var(--ink);}
.today-btn{
  font-family:var(--font-serif);
  font-size:15px;font-weight:600;color:var(--accent);
}
.day-title{text-align:center;flex:1;min-width:0;}
.dt-main{
  font-family:var(--font-serif);
  font-size:17px;font-weight:600;letter-spacing:.5px;
}
.dt-sub{font-size:11px;color:var(--ink3);margin-top:2px;}

/* 日期切换 */
.day-switch{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;
}
.day-switch .day-title{min-width:78px;flex:none;}
.day-nav{
  width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;
  font-size:19px;line-height:1;padding-bottom:1px;
  color:var(--ink2);
  background:rgba(255,253,250,.85);
  border:1px solid var(--line);
  flex:none;transition:.15s;
}
.day-nav:active{background:#FFFDFA;color:var(--accent);transform:scale(.92);}

/* ---------- 日历 ---------- */
.cal-card{
  background:#FFFDFA;
  border-radius:4px;
  border:1px solid var(--line);
  padding:16px 8px 12px;
  margin-top:12px;
  box-shadow:0 1px 1px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.055);
}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 14px;gap:8px;}
.cal-left{display:flex;align-items:center;gap:10px;min-width:0;}
.cal-title{
  font-family:var(--font-serif);
  font-size:17px;font-weight:600;letter-spacing:.5px;white-space:nowrap;
}
.view-seg{display:flex;background:#F4EFE3;border-radius:9px;padding:2px;flex:none;border:1px solid var(--line);}
.view-seg button{padding:3px 10px;font-size:11px;border-radius:7px;color:var(--ink2);transition:.15s;}
.view-seg button.on{background:#FFFDFA;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.09);}
.cal-nav{display:flex;gap:6px;flex:none;}
.nav-btn{
  width:30px;height:30px;border-radius:9px;
  background:#F4EFE3;border:1px solid var(--line);
  font-size:15px;color:var(--ink2);
  display:grid;place-items:center;line-height:1;transition:.15s;
}
.nav-btn:active{background:#ECE5D5;}
.weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);text-align:center;
  font-size:12px;color:var(--ink3);padding-bottom:6px;
}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.cell{
  position:relative;aspect-ratio:1/1.28;border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:5px;gap:0;font-size:14px;color:var(--ink);
  transition:background .15s,transform .1s;
}
.cell.out{color:#D8D2C5;}
.cell.future{color:#C5BEB0;}
.cell.has{background:#FAF7EF;}
.cell.today{background:var(--accent-soft);}
.cell.today .dnum{color:var(--accent);font-weight:700;}
.cell:active{transform:scale(.94);}
.dnum{line-height:1.15;font-family:var(--font-serif);font-weight:500;}
.cell.today .dnum{font-weight:700;}
.lunar-line{
  font-size:8.5px;line-height:1.3;margin-top:1px;color:var(--ink3);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:0 2px;text-align:center;
}
.lunar-line.is-festival{color:var(--festival);font-weight:600;}
.lunar-line.is-term{color:var(--term);font-weight:500;}
.cicon{height:12px;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.cbar{position:absolute;left:20%;right:20%;bottom:4px;height:2.5px;border-radius:2px;background:#EDE7DA;overflow:hidden;}
.cbar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .2s;}
.wdot{position:absolute;top:5px;right:6px;width:4px;height:4px;border-radius:50%;background:var(--down);}
.cell.today .wdot{background:var(--accent);}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding-top:12px;font-size:11px;color:var(--ink3);}
.legend span{display:flex;align-items:center;}
.legend .lg{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:#ccc;}
.legend .lg.fest{background:var(--festival);border-radius:50%;}
.legend .lg.term{background:var(--term);border-radius:50%;}
.legend .lg.mood{background:#D99A2B;border-radius:50%;}
.legend .lg.bar{background:var(--accent);}
.legend .lg.wdot{background:var(--down);border-radius:50%;}
.tip{text-align:center;font-size:12px;color:var(--ink3);padding:18px 0 0;}

/* ---------- 年视图 ---------- */
.year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:2px;}
.year-month{
  background:#FAF7EF;border-radius:6px;border:1px solid #F0EBDF;
  padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;
}
.ym-title{
  font-family:var(--font-serif);
  font-size:12px;font-weight:600;color:var(--ink);
  margin-bottom:5px;padding:2px 8px;border-radius:5px;transition:.15s;letter-spacing:.3px;
}
.ym-title:active{background:#ECE5D5;color:var(--accent);}
.ym-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;width:100%;}
.ym-cell{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:8px;line-height:1;color:var(--ink2);border-radius:2.5px;position:relative;padding:0;
  transition:background .15s;
}
.ym-cell.out{color:transparent;}
.ym-cell.future{color:#D8D2C5;}
.ym-cell.done{background:var(--accent-soft);}
.ym-cell.partial{background:#FBF6EC;}
.ym-cell.today{background:var(--accent);color:#fff;font-weight:700;}
.ym-cell:active{transform:scale(.88);}
.ym-cell .ydot{
  position:absolute;bottom:1px;left:50%;transform:translateX(-50%);
  width:2.5px;height:2.5px;border-radius:50%;
}
.ym-cell.today .ydot{background:#fff !important;}
@media (max-width:360px){
  .year-grid{gap:6px;}
  .ym-cell{font-size:7px;}
}

/* ---------- 页面标签 ---------- */
.dtab-bar{
  position:relative;display:flex;gap:5px;
  background:transparent;
  padding:0;
  margin-top:16px;
  border-bottom:1.5px solid var(--line);
  touch-action:pan-y;
}
.dtab{
  flex:1 1 0;min-width:0;
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:9px 4px 8px;border-radius:9px 9px 0 0;
  font-size:13px;color:var(--ink2);
  background:#F4EFE3;
  border:1px solid var(--line);
  border-bottom:none;
  white-space:nowrap;position:relative;top:1.5px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:background .18s,color .18s;
  will-change:transform;
}
.dtab:active{background:#ECE5D5;}
.dtab.on{
  background:#FFFDFA;color:var(--ink);font-weight:600;
  box-shadow:0 -2px 8px rgba(0,0,0,.035);
}
.dtab.dragging{
  background:#FFFDFA;color:var(--ink);font-weight:600;
  border:1px solid var(--line);
  border-radius:9px;
  box-shadow:0 10px 26px rgba(0,0,0,.16);
  z-index:30;position:relative;transition:none;top:0;
}
.dtab-emoji{font-size:14px;line-height:1;}
.drag-hint{text-align:center;font-size:11px;color:#B5AC9B;padding:9px 0 2px;}

/* ---------- 卡片 ---------- */
.card{
  background:#FFFDFA;
  border-radius:4px;
  border:1px solid var(--line);
  padding:16px;margin-top:12px;
  box-shadow:0 1px 1px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.card-head h3{margin:0;font-size:15px;font-weight:600;font-family:var(--font-serif);letter-spacing:.3px;}
.hint{font-size:11px;color:var(--ink3);}
.head-right{display:flex;align-items:center;gap:8px;}

/* ---------- 心情 ---------- */
.mood-picker{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;}
.mood-btn{
  flex:0 0 calc(20% - 4px);display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:9px 0;border-radius:10px;transition:.15s;
}
.mood-btn:active{background:#FAF7EF;transform:scale(.93);}
.ml{font-size:11px;color:var(--ink2);}
.x-btn{
  margin-left:auto;width:26px;height:26px;border-radius:8px;color:#C4BCAB;font-size:12px;
  display:grid;place-items:center;flex:none;
}
.x-btn:active{background:#F4EFE3;color:var(--ink2);}
.empty-line{font-size:12px;color:var(--ink3);text-align:center;padding:16px 0 4px;}

/* ---------- 随手记 ---------- */
.note-form{display:flex;gap:8px;align-items:flex-end;}
.note-form textarea{
  flex:1;min-width:0;border:1.5px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:13px;line-height:1.55;resize:none;outline:none;
  background:#FBF8F0;color:var(--ink);min-height:44px;
}
.note-form textarea:focus{border-color:var(--accent);background:#FFFDFA;}

/* ---------- 混合时间线 ---------- */
.tl-list{margin-top:2px;}
.tl-row{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid #F2EDE2;}
.tl-row:last-child{border-bottom:none;padding-bottom:0;}
.tl-time{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none;width:36px;padding-top:2px;}
.tl-body{flex:1;min-width:0;display:flex;align-items:center;gap:7px;}
.tl-body.is-note{display:block;padding-top:1px;}
.tl-name{font-size:13px;color:var(--ink2);}
.tl-text{font-size:13px;line-height:1.55;color:var(--ink);word-break:break-word;white-space:pre-wrap;}
.tl-row .x-btn{margin-left:auto;flex:none;margin-top:0;}
.order-btn{display:flex;align-items:center;gap:3px;}

/* ---------- 体重 ---------- */
.seg{display:flex;background:#F4EFE3;border-radius:9px;padding:2px;flex:none;border:1px solid var(--line);}
.seg button{padding:4px 12px;font-size:12px;border-radius:7px;color:var(--ink2);transition:.15s;}
.seg button.on{background:#FFFDFA;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.09);}
.w-form{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.w-input{
  flex:1;min-width:0;border:1.5px solid var(--line);border-radius:9px;
  padding:10px 12px;font-size:17px;font-weight:600;
  background:#FBF8F0;outline:none;color:var(--ink);transition:.15s;
}
.w-input:focus{border-color:var(--accent);background:#FFFDFA;}
.w-input::-webkit-outer-spin-button,.w-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.w-input{-moz-appearance:textfield;}
.w-unit{font-size:13px;color:var(--ink2);flex:none;}
.btn{
  background:var(--accent);color:#fff;border-radius:9px;padding:10px 16px;
  font-size:14px;font-weight:600;flex:none;transition:.15s;
  box-shadow:0 2px 6px rgba(201,107,74,.28);
}
.btn:active{filter:brightness(.94);transform:scale(.97);}
.btn.ghost{background:#F4EFE3;color:var(--ink2);box-shadow:none;border:1px solid var(--line);}
.w-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F2EDE2;}
.w-t{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;}
.w-v{font-size:16px;font-weight:600;font-family:var(--font-serif);}
.w-v i{font-size:11px;font-weight:400;color:var(--ink3);font-style:normal;margin-left:2px;font-family:inherit;}
.mini{
  font-size:11px;color:var(--ink2);background:#F5F0E4;
  border:1px solid var(--line);border-radius:8px;padding:5px 10px;flex:none;
}
.mini:active{background:#ECE5D5;}
.mini.danger{color:var(--up);}
.w-row .mini:first-of-type{margin-left:auto;}

/* ---------- 体重统计内嵌 ---------- */
.stat-summary{display:flex;gap:8px;margin-bottom:14px;}
.stat-box{flex:1;min-width:0;background:#FAF7EF;border-radius:9px;padding:11px 10px;border:1px solid #F0EBDF;}
.stat-box .k{font-size:11px;color:var(--ink3);white-space:nowrap;}
.stat-box .v{
  font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;
  white-space:nowrap;letter-spacing:-.3px;font-family:var(--font-serif);
}
.stat-box .v i{font-size:10px;font-weight:400;color:var(--ink3);font-style:normal;margin-left:2px;font-family:inherit;}
.stat-box .v.flat{color:var(--ink2);}
.stat-tabs{display:flex;background:#F1EBDF;border-radius:9px;padding:3px;margin-bottom:12px;}
.stat-tabs button{flex:1;padding:7px;border-radius:7px;font-size:12px;color:var(--ink2);transition:.15s;}
.stat-tabs button.on{background:#FFFDFA;color:var(--ink);font-weight:600;box-shadow:0 1px 5px rgba(0,0,0,.08);}
.chart{width:100%;height:auto;display:block;}
.chart-empty{text-align:center;color:var(--ink3);font-size:13px;padding:36px 0;}
.chart-empty span{font-size:11px;color:#C0B7A6;}

/* ---------- 自定义模块 ---------- */
.mod{padding:11px 0;border-top:1px solid #F2EDE2;}
.mod:first-of-type{border-top:none;padding-top:2px;}
.mod-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.mod-name{font-size:14px;font-weight:500;display:flex;align-items:center;}
.done-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border-radius:50%;background:var(--down);color:#fff;
  font-size:10px;margin-left:6px;flex:none;animation:pop .35s cubic-bezier(.3,1.6,.5,1);
}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.all-done{
  font-size:11px;color:#B7791F;font-weight:600;background:#FBF1DE;
  border-radius:8px;padding:3px 8px;white-space:nowrap;
}
.mod-count{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;}
.mod-del{width:22px;height:22px;border-radius:7px;color:#CFC7B6;font-size:11px;display:grid;place-items:center;flex:none;}
.mod-del:active{background:#FBEDE9;color:var(--up);}
.mod-slots{display:flex;flex-wrap:wrap;gap:8px;}
.slot{
  width:38px;height:38px;border-radius:10px;background:#F5F0E4;
  display:grid;place-items:center;font-size:17px;
  filter:grayscale(1);opacity:.32;
  transition:.2s cubic-bezier(.3,1.4,.5,1);
}
.slot.on{
  filter:none;opacity:1;background:var(--accent-soft);
  box-shadow:inset 0 0 0 1.5px rgba(201,107,74,.38);
  transform:translateY(-1px);
}
.slot:active{transform:scale(.88);}

/* ---------- 添加模块表单 ---------- */
.add-form{margin-top:12px;border-top:1px dashed var(--line);padding-top:14px;}
.emoji-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px;max-height:150px;overflow-y:auto;padding:2px;}
.emo{
  width:35px;height:35px;border-radius:10px;background:#F5F0E4;
  display:grid;place-items:center;font-size:17px;transition:.15s;
}
.emo.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);transform:scale(1.06);}
.add-form input{
  border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;
  outline:none;width:100%;background:#FBF8F0;color:var(--ink);
}
.add-form input:focus{border-color:var(--accent);background:#FFFDFA;}
.target-row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--ink2);}
.target-row input{width:80px;text-align:center;}
.form-note{font-size:11px;color:var(--ink3);margin-top:10px;line-height:1.6;}
.form-actions{display:flex;gap:10px;margin-top:14px;}
.form-actions .btn{flex:1;text-align:center;}

/* ---------- 弹窗 ---------- */
#modalRoot{position:fixed;inset:0;z-index:100;pointer-events:none;}
.modal-mask{
  position:absolute;inset:0;background:rgba(45,38,30,.46);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;transition:opacity .2s;pointer-events:auto;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.modal-mask.show{opacity:1;}
.modal-card{
  width:100%;max-width:330px;
  background:#FFFDFA;
  border:1px solid var(--line);
  border-radius:6px;
  padding:22px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.28);
  transform:scale(.92) translateY(8px);opacity:0;
  transition:transform .26s cubic-bezier(.3,1.3,.5,1),opacity .2s;
  max-height:82vh;overflow:auto;
}
.modal-mask.show .modal-card{transform:none;opacity:1;}
.modal-title{font-size:16px;font-weight:600;text-align:center;font-family:var(--font-serif);}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions .btn{flex:1;text-align:center;}
.btn.danger{background:var(--up);box-shadow:0 2px 6px rgba(192,85,75,.3);}

/* 夸奖弹窗 */
.praise{text-align:center;}
.praise-emoji{font-size:46px;line-height:1;animation:bounce 1.8s ease-in-out infinite;}
@keyframes bounce{
  0%,100%{transform:translateY(0) scale(1);}
  30%{transform:translateY(-7px) scale(1.05);}
  55%{transform:translateY(0) scale(1);}
  75%{transform:translateY(-2px) scale(1.01);}
}
.praise h3{margin:14px 0 6px;font-size:18px;letter-spacing:.5px;font-family:var(--font-serif);}
.praise p{margin:0 0 4px;font-size:13px;color:var(--ink2);line-height:1.7;}

.praise-strong{position:relative;padding-top:4px;}
.praise-strong::before{
  content:'';position:absolute;left:-12px;right:-12px;top:-14px;height:120px;
  background:radial-gradient(circle at 50% 0%, rgba(201,107,74,.16), transparent 72%);
  pointer-events:none;z-index:0;
}
.praise-strong > *{position:relative;z-index:1;}
.praise-strong .praise-emoji{font-size:66px;animation:praise-pop 1.2s cubic-bezier(.3,1.5,.5,1) infinite;}
@keyframes praise-pop{
  0%,100%{transform:scale(1) rotate(0deg);}
  25%{transform:scale(1.15) rotate(-6deg);}
  50%{transform:scale(1.05) rotate(0deg);}
  75%{transform:scale(1.12) rotate(6deg);}
}
.praise-strong h3{
  margin:12px 0 6px;font-size:24px;letter-spacing:2px;
  background:linear-gradient(135deg,#C96B4A,#D99A2B,#B85C7A);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;
}
.praise-strong p{font-size:14px;color:var(--ink);font-weight:500;margin-bottom:2px;}
.praise-strong .stars{font-size:18px;letter-spacing:6px;margin:10px 0 2px;
  animation:star-glow 1.6s ease-in-out infinite;}
@keyframes star-glow{
  0%,100%{opacity:.55;transform:scale(1);}
  50%{opacity:1;transform:scale(1.08);}
}
.praise-strong .btn{
  background:linear-gradient(135deg,#C96B4A,#D99A2B);
  box-shadow:0 6px 18px rgba(201,107,74,.32);
  margin-top:16px !important;
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   PWA：Service Worker 注册
   ============================================================ */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.warn('[PWA] Service Worker 注册失败（file:// 打开时属正常）:', err);
    });
  });
}

/* ============================================================
   1. 数据层
   ============================================================ */
const STORE_KEY = 'riji-v1';
const MOODS = [
  { key:'joy',     name:'开心', color:'#D99A2B' },
  { key:'excited', name:'兴奋', color:'#D8753D' },
  { key:'heart',   name:'心动', color:'#C25C7E' },
  { key:'calm',    name:'平静', color:'#4C8B7A' },
  { key:'meh',     name:'一般', color:'#98A2B3' },
  { key:'sad',     name:'难过', color:'#5B8DEF' },
  { key:'angry',   name:'生气', color:'#C0554B' },
];
const EMOJIS = [
  '💧','🍎','🏃','📖','🧘','☀️','🌙','💊','🎸','✍️','🥗','🛌',
  '🚶','🚴','🏊','🦷','🧴','🧹','🍵','🥛','🎯','🎨','🌱','💤',
  '🧠','🚭','🐱','🍇','🎹','🧸','🎧','🪴','🥕','🍊','🛁','⏰'
];

const PAGES = {
  mood:   { name:'心情', emoji:'😊' },
  weight: { name:'体重', emoji:'⚖️' },
  check:  { name:'打卡', emoji:'✅' },
};
const PAGE_KEYS = ['mood','weight','check'];

const PRAISE_MODULE = [
  { emoji:'👍', title:'完成一项！', text:'小小的进步，也值得被看见' },
  { emoji:'💪', title:'干得漂亮',   text:'又拿下一项，继续保持' },
  { emoji:'✨', title:'这项搞定',   text:'每一步都算数' },
  { emoji:'🌱', title:'小目标达成', text:'积少成多，你做得很好' },
  { emoji:'👏', title:'不错哦',     text:'坚持就是最好的习惯' },
  { emoji:'🍀', title:'打卡成功',   text:'给自己一点小小的奖励吧' },
];

const PRAISE_ALL = [
  { emoji:'🎉', title:'全部完成！', text:'今天的你，闪闪发光 ✨' },
  { emoji:'🏆', title:'今日满分',   text:'每一项都点亮，太厉害了' },
  { emoji:'🎊', title:'圆满收官',   text:'给自己一个大大的拥抱' },
  { emoji:'🌈', title:'全部达成',   text:'坚持的样子，真好看' },
  { emoji:'⭐', title:'完美一天',   text:'每一格都为你亮起' },
  { emoji:'🚀', title:'今日超神',   text:'全部目标一网打尽，了不起' },
];

const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY = () => dkey(new Date());
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const uid = () => Math.random().toString(36).slice(2,9);
const avg = a => a.reduce((s,v)=>s+v,0) / a.length;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const EPOCH = '1970-01-01';

function defaultState(){
  return {
    unit: 'kg',
    moods: [],
    notes: [],
    weights: [],
    checks: {},
    modules: [
      { id:'m1', name:'喝水',  icon:'💧', target:8, createdDate: EPOCH, deletedDate: null },
      { id:'m2', name:'吃水果', icon:'🍎', target:2, createdDate: EPOCH, deletedDate: null },
      { id:'m3', name:'运动',  icon:'🏃', target:1, createdDate: EPOCH, deletedDate: null },
    ],
    pageOrder: ['mood','weight','check'],
    celebrated: {},
    celebratedMods: {},
    timelineOrder: 'desc',
  };
}
let state;
try {
  const raw = JSON.parse(localStorage.getItem(STORE_KEY));
  state = (raw && Array.isArray(raw.modules)) ? raw : defaultState();
} catch(e){ state = defaultState(); }

state.notes          = Array.isArray(state.notes) ? state.notes : [];
state.celebrated     = (state.celebrated && typeof state.celebrated === 'object') ? state.celebrated : {};
state.celebratedMods = (state.celebratedMods && typeof state.celebratedMods === 'object') ? state.celebratedMods : {};
state.timelineOrder  = state.timelineOrder === 'asc' ? 'asc' : 'desc';
if(!Array.isArray(state.pageOrder) ||
   state.pageOrder.length !== PAGE_KEYS.length ||
   !PAGE_KEYS.every(k => state.pageOrder.includes(k))){
  state.pageOrder = PAGE_KEYS.slice();
}

state.modules.forEach(m => {
  if(!m.createdDate) m.createdDate = EPOCH;
  if(m.deletedDate === undefined) m.deletedDate = null;
});

const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(state));

const toDisplay = kg => state.unit === 'kg' ? kg : kg * 2;
const fromDisplay = v => state.unit === 'kg' ? v : v / 2;
const unitLabel = () => state.unit === 'kg' ? 'kg' : '斤';

function getActiveModules(dateKey){
  return state.modules.filter(m => {
    if(m.createdDate && dateKey < m.createdDate) return false;
    if(m.deletedDate && dateKey >= m.deletedDate) return false;
    return true;
  });
}

/* ============================================================
   2. 农历工具
   ============================================================ */
const lunarCache = new Map();

function getLunarInfo(y, m, d){
  const key = `${y}-${pad(m)}-${pad(d)}`;
  if(lunarCache.has(key)) return lunarCache.get(key);

  const result = { lunarText:'', festival:'', term:'', isFestival:false, isTerm:false };
  try {
    if(typeof Solar === 'undefined') return result;

    const solar = Solar.fromYmd(y, m, d);
    const lunar = solar.getLunar();

    let festivals = [];
    try { festivals = lunar.getFestivals() || []; } catch(_) {}
    try {
      const solarFest = solar.getFestivals() || [];
      festivals = festivals.concat(solarFest);
    } catch(_) {}

    const festival = festivals.length ? festivals[0] : '';

    let term = '';
    try { term = solar.getJieQi() || ''; } catch(_) {}

    let lunarText = '';
    if(festival){
      lunarText = festival;
      result.isFestival = true;
    } else if(term){
      lunarText = term;
      result.isTerm = true;
    } else {
      try {
        const dayInChinese = lunar.getDayInChinese();
        lunarText = dayInChinese;
        if(dayInChinese === '初一'){
          lunarText = lunar.getMonthInChinese() + '月';
        }
      } catch(_) {}
    }

    result.lunarText = lunarText;
    result.festival = festival;
    result.term = term;
  } catch(err){}

  lunarCache.set(key, result);
  return result;
}

/* ============================================================
   3. 心情 SVG
   ============================================================ */
function heartPath(cx, cy, s){
  const f = n => n.toFixed(2);
  return `M${f(cx)} ${f(cy+0.8*s)}
    C${f(cx-1.05*s)} ${f(cy-0.15*s)} ${f(cx-0.7*s)} ${f(cy-1.0*s)} ${f(cx)} ${f(cy-0.3*s)}
    C${f(cx+0.7*s)} ${f(cy-1.0*s)} ${f(cx+1.05*s)} ${f(cy-0.15*s)} ${f(cx)} ${f(cy+0.8*s)} Z`;
}
function starPath(cx, cy, r){
  const i = r * 0.42, f = n => n.toFixed(2);
  return `M${f(cx)} ${f(cy-r)} L${f(cx+i)} ${f(cy-i)} L${f(cx+r)} ${f(cy)}
          L${f(cx+i)} ${f(cy+i)} L${f(cx)} ${f(cy+r)} L${f(cx-i)} ${f(cy+i)}
          L${f(cx-r)} ${f(cy)} L${f(cx-i)} ${f(cy-i)} Z`;
}

function moodSVG(key, size){
  const open = `<svg viewBox="0 0 40 40" width="${size}" height="${size}" fill="none"
    stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">`;
  const face  = `<circle cx="20" cy="20" r="16.5"/>`;
  const blush = `<ellipse cx="10.8" cy="24.8" rx="2.9" ry="1.9" fill="currentColor" stroke="none" opacity=".22"/>
                 <ellipse cx="29.2" cy="24.8" rx="2.9" ry="1.9" fill="currentColor" stroke="none" opacity=".22"/>`;
  let body = '';
  switch(key){
    case 'joy':
      body = `<path d="M10.5 15.5 Q14.5 10.8 18.5 15.5"/>
              <path d="M21.5 15.5 Q25.5 10.8 29.5 15.5"/>
              <path d="M12.5 23 Q20 30.8 27.5 23"/>`;
      break;
    case 'excited':
      body = `<path d="${starPath(14.5,15.5,4.3)}" fill="currentColor" stroke="none"/>
              <path d="${starPath(25.5,15.5,4.3)}" fill="currentColor" stroke="none"/>
              <path d="M12.8 22.5 Q20 31.6 27.2 22.5 Q20 25.9 12.8 22.5 Z"
                    fill="currentColor" stroke="none"/>`;
      break;
    case 'heart':
      body = `<path d="${heartPath(14.5,16,4.5)}" fill="currentColor" stroke="none"/>
              <path d="${heartPath(25.5,16,4.5)}" fill="currentColor" stroke="none"/>
              <path d="M14 25.2 Q20 29.6 26 25.2"/>`;
      break;
    case 'calm':
      body = `<circle cx="14.5" cy="16" r="1.8" fill="currentColor" stroke="none"/>
              <circle cx="25.5" cy="16" r="1.8" fill="currentColor" stroke="none"/>
              <path d="M14.5 25 Q20 27.6 25.5 25"/>`;
      break;
    case 'meh':
      body = `<circle cx="14.5" cy="16" r="1.8" fill="currentColor" stroke="none"/>
              <circle cx="25.5" cy="16" r="1.8" fill="currentColor" stroke="none"/>
              <path d="M14.5 25.8 H25.5"/>`;
      break;
    case 'sad':
      body = `<circle cx="14.5" cy="16" r="1.8" fill="currentColor" stroke="none"/>
              <circle cx="25.5" cy="16" r="1.8" fill="currentColor" stroke="none"/>
              <path d="M13.5 27.6 Q20 21.4 26.5 27.6"/>
              <path d="M27.4 20.5 Q28.6 23.4 27.4 24.3 Q26.2 23.4 27.4 20.5 Z"
                    fill="currentColor" stroke="none" opacity=".55"/>`;
      break;
    case 'angry':
      body = `<path d="M10.3 12.3 L17.6 15.6"/><path d="M29.7 12.3 L22.4 15.6"/>
              <circle cx="14.5" cy="18.6" r="1.8" fill="currentColor" stroke="none"/>
              <circle cx="25.5" cy="18.6" r="1.8" fill="currentColor" stroke="none"/>
              <path d="M13.5 27.6 Q20 22 26.5 27.6"/>`;
      break;
  }
  return open + face + blush + body + `</svg>`;
}
const moodColor = k => (MOODS.find(m=>m.key===k) || {}).color || '#98A2B3';
const moodName  = k => (MOODS.find(m=>m.key===k) || {}).name  || '';

/* ============================================================
   4. 派生数据
   ============================================================ */
function aggregateMood(dateKey){
  const list = state.moods.filter(x => x.date === dateKey);
  if(!list.length) return null;
  const counts = {};
  list.forEach(x => counts[x.key] = (counts[x.key] || 0) + 1);
  let best = list[0];
  list.forEach(x => {
    if(counts[x.key] > counts[best.key]) best = x;
    else if(counts[x.key] === counts[best.key] && x.time >= best.time) best = x;
  });
  return best.key;
}

function dayProgress(dateKey){
  const mods = getActiveModules(dateKey);
  let total = 0, got = 0;
  mods.forEach(m => {
    total += m.target;
    got += Math.min(state.checks[dateKey + '|' + m.id] || 0, m.target);
  });
  return total ? got / total : 0;
}
function isDayComplete(dateKey){
  return getActiveModules(dateKey).length > 0 && dayProgress(dateKey) >= 1;
}
function weightStats(){
  const sorted = [...state.weights].sort((a,b) => {
    const ka = a.date + ' ' + a.time, kb = b.date + ' ' + b.time;
    return ka > kb ? 1 : ka < kb ? -1 : 0;
  });
  if(!sorted.length) return { cur:null, last:null, total:null };
  const cur = sorted[sorted.length - 1];
  const prev = sorted.length > 1 ? sorted[sorted.length - 2] : null;
  const first = sorted[0];
  return {
    cur: toDisplay(cur.kg),
    last: prev ? toDisplay(cur.kg) - toDisplay(prev.kg) : null,
    total: sorted.length > 1 ? toDisplay(cur.kg) - toDisplay(first.kg) : null,
  };
}

function buildTimeline(dateKey){
  const moods = state.moods.filter(x => x.date === dateKey);
  const notes = (state.notes || []).filter(x => x.date === dateKey);

  const items = [
    ...moods.map(m => ({ type:'mood', id:m.id, time:m.time, key:m.key })),
    ...notes.map(n => ({ type:'note', id:n.id, time:n.time, text:n.text })),
  ];

  const dir = state.timelineOrder === 'asc' ? 1 : -1;
  items.sort((a,b) => {
    if(a.time === b.time) return 0;
    return a.time < b.time ? -dir : dir;
  });
  return items;
}

/* ============================================================
   5. 视图状态
   ============================================================ */
const _now = new Date();
let view = {
  name: 'calendar',
  calMode: 'month',
  year: _now.getFullYear(),
  month: _now.getMonth(),
  date: TODAY(),
  page: 'mood',
  wDate: TODAY(),
  showAddMod: false,
  newIcon: '💧',
  statRange: 'week',
};

/* ============================================================
   6. 弹窗系统
   ============================================================ */
const modalRoot = document.getElementById('modalRoot');

function openModal(html){
  modalRoot.innerHTML = `<div class="modal-mask" id="modalMask">
    <div class="modal-card">${html}</div>
  </div>`;
  requestAnimationFrame(() => {
    const m = document.getElementById('modalMask');
    if(m) m.classList.add('show');
  });
}
function closeModal(){
  const m = document.getElementById('modalMask');
  if(!m){ modalRoot.innerHTML = ''; return; }
  m.classList.remove('show');
  setTimeout(() => { modalRoot.innerHTML = ''; }, 220);
}

function openWeightEditModal(id){
  const rec = state.weights.find(w => w.id === id);
  if(!rec) return;
  const u = unitLabel();
  openModal(`
    <div class="modal-title">修改体重</div>
    <div class="w-form" style="margin-top:18px">
      <input class="w-input" id="editWInput" type="number" step="0.1" inputmode="decimal"
             value="${toDisplay(rec.kg).toFixed(1)}">
      <span class="w-unit">${u}</span>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" data-act="close-modal">取消</button>
      <button class="btn" data-act="confirm-edit-weight" data-id="${id}">保存</button>
    </div>
  `);
  setTimeout(() => {
    const el = document.getElementById('editWInput');
    if(el){ el.focus(); el.select(); }
  }, 250);
}

function openWeightDeleteModal(id){
  openModal(`
    <div class="praise">
      <div class="praise-emoji" style="animation:none">🗑️</div>
      <h3 style="font-size:17px">删除这条记录？</h3>
      <p>删除后将无法恢复</p>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" data-act="close-modal">取消</button>
      <button class="btn danger" data-act="confirm-del-weight" data-id="${id}">删除</button>
    </div>
  `);
}

function openDeleteModuleModal(mid){
  const m = state.modules.find(x => x.id === mid);
  if(!m) return;
  openModal(`
    <div class="praise">
      <div class="praise-emoji" style="animation:none">🗂️</div>
      <h3 style="font-size:17px">删除「${esc(m.name)}」？</h3>
      <p style="margin-top:8px;line-height:1.75">
        删除后，这个模块将从<b>当前日期起</b>不再显示。<br>
        之前所有日期的打卡记录会<b>完整保留</b>。
      </p>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" data-act="close-modal">取消</button>
      <button class="btn danger" data-act="confirm-del-mod" data-id="${mid}">删除</button>
    </div>
  `);
}

function openPraiseModal(kind){
  const isAll = kind === 'all';
  const pool = isAll ? PRAISE_ALL : PRAISE_MODULE;
  const p = pool[Math.floor(Math.random() * pool.length)];

  openModal(`
    <div class="praise ${isAll ? 'praise-strong' : ''}">
      <div class="praise-emoji">${p.emoji}</div>
      <h3>${p.title}</h3>
      <p>${p.text}</p>
      ${isAll ? '<div class="stars">✨ ⭐ ✨ ⭐ ✨</div>' : ''}
      <button class="btn" data-act="close-modal"
              style="width:100%;margin-top:${isAll ? '16px' : '14px'}">${isAll ? '收下夸奖' : '好'}</button>
    </div>
  `);
}

modalRoot.addEventListener('click', e => {
  if(e.target.id === 'modalMask'){ closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  if(act === 'close-modal'){ closeModal(); return; }

  if(act === 'confirm-edit-weight'){
    const input = document.getElementById('editWInput');
    const raw = parseFloat(input && input.value);
    if(!isFinite(raw) || raw <= 0){ if(input){ input.focus(); input.select(); } return; }
    const kg = Math.round(fromDisplay(raw) * 10) / 10;
    const rec = state.weights.find(w => w.id === el.dataset.id);
    if(rec) rec.kg = kg;
    save(); closeModal(); render();
    return;
  }

  if(act === 'confirm-del-weight'){
    state.weights = state.weights.filter(w => w.id !== el.dataset.id);
    save(); closeModal(); render();
    return;
  }

  if(act === 'confirm-del-mod'){
    const mid = el.dataset.id;
    const m = state.modules.find(x => x.id === mid);
    if(m && !m.deletedDate){
      m.deletedDate = view.date;
      Object.keys(state.celebratedMods).forEach(k => {
        const idx = k.lastIndexOf('|');
        if(idx > -1 && k.slice(idx + 1) === mid) delete state.celebratedMods[k];
      });
    }
    save(); closeModal(); render();
    return;
  }
});
modalRoot.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.id === 'editWInput'){
    e.preventDefault();
    const btn = modalRoot.querySelector('[data-act="confirm-edit-weight"]');
    if(btn) btn.click();
  }
  if(e.key === 'Escape') closeModal();
});

/* ============================================================
   7. 渲染
   ============================================================ */
const app = document.getElementById('app');

function render(reset){
  const sy = window.scrollY;
  app.innerHTML = view.name === 'calendar' ? calendarHTML() : dayHTML();
  if(view.name === 'day') setupTabs();
  window.scrollTo(0, reset ? 0 : sy);
}

/* ---------- 7.1 日历首页 ---------- */

  return `
  <div class="page">
    <header class="appbar">
      <div class="brand">日迹</div>
      <button class="icon-btn" data-act="open-weight" aria-label="体重趋势">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17l5-6 4 4 5-7 4 5"/>
        </svg>
      </button>
    </header>

    <div class="cal-card">
      ${calHeadHTML()}
      ${view.calMode === 'year' ? yearGridHTML() : monthGridHTML()}
      <div class="legend">
        <span><i class="lg fest"></i>节日</span>
        <span><i class="lg term"></i>节气</span>
        <span><i class="lg mood"></i>心情</span>
        <span><i class="lg bar"></i>完成度</span>
        <span><i class="lg wdot"></i>体重</span>
      </div>
    </div>

    <div class="tip">${view.calMode === 'year'
      ? '点击月份标题切换到月视图，点击日期查看当天详情'
      : '点击任意日期，记录当天的心情、体重与日常'}</div>
  </div>`;
}

function monthGridHTML(){
  const y = view.year, m = view.month;
  const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
  const dim = new Date(y, m+1, 0).getDate();
  const prevDim = new Date(y, m, 0).getDate();
  const tk = TODAY();

  let cells = '';
  for(let i = firstDow - 1; i >= 0; i--)
    cells += `<div class="cell out"><span class="dnum">${prevDim - i}</span></div>`;

  for(let d = 1; d <= dim; d++){
    const key = `${y}-${pad(m+1)}-${pad(d)}`;
    const mk = aggregateMood(key);
    const hasW = state.weights.some(w => w.date === key);
    const prog = dayProgress(key);
    const info = getLunarInfo(y, m+1, d);

    const cls = ['cell'];
    if(key === tk) cls.push('today');
    if(key > tk) cls.push('future');
    if(mk || hasW || prog > 0 || (state.notes||[]).some(n=>n.date===key)) cls.push('has');

    const lunarCls = info.isFestival ? 'lunar-line is-festival'
                   : info.isTerm   ? 'lunar-line is-term'
                   : 'lunar-line';

    cells += `<button class="${cls.join(' ')}" data-date="${key}">
      <span class="dnum">${d}</span>
      <span class="${lunarCls}">${esc(info.lunarText)}</span>
      <span class="cicon">${mk ? `<span style="color:${moodColor(mk)}">${moodSVG(mk,13)}</span>` : ''}</span>
      ${prog > 0 ? `<span class="cbar"><i style="width:${(prog*100).toFixed(0)}%"></i></span>` : ''}
      ${hasW ? `<span class="wdot"></span>` : ''}
    </button>`;
  }
  const rest = (7 - (firstDow + dim) % 7) % 7;
  for(let i = 1; i <= rest; i++)
    cells += `<div class="cell out"><span class="dnum">${i}</span></div>`;

  return `<div class="weekdays">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div>
          <div class="grid">${cells}</div>`;
}

function yearGridHTML(){
  const y = view.year;
  const tk = TODAY();
  let monthsHtml = '';

  for(let m = 0; m < 12; m++){
    const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
    const dim = new Date(y, m+1, 0).getDate();

    let cells = '';
    for(let i = 0; i < firstDow; i++) cells += `<span class="ym-cell out"></span>`;

    for(let d = 1; d <= dim; d++){
      const key = `${y}-${pad(m+1)}-${pad(d)}`;
      const mk = aggregateMood(key);
      const hasW = state.weights.some(w => w.date === key);
      const prog = dayProgress(key);
      const hasNote = (state.notes||[]).some(n=>n.date===key);
      const isToday = key === tk;
      const isFuture = key > tk;

      const cls = ['ym-cell'];
      if(isFuture) cls.push('future');
      if(isToday) cls.push('today');
      else if(prog >= 1) cls.push('done');
      else if(prog > 0) cls.push('partial');

      let dot = '';
      if(mk) dot = `<span class="ydot" style="background:${moodColor(mk)}"></span>`;
      else if(hasW) dot = `<span class="ydot" style="background:var(--down)"></span>`;
      else if(hasNote) dot = `<span class="ydot" style="background:#C4BCAB"></span>`;

      cells += `<button class="${cls.join(' ')}" data-date="${key}">
        <span>${d}</span>${dot}
      </button>`;
    }

    const total = firstDow + dim;
    const rest = (7 - total % 7) % 7;
    for(let i = 0; i < rest; i++) cells += `<span class="ym-cell out"></span>`;

    monthsHtml += `<div class="year-month">
      <button class="ym-title" data-ym="${m}">${m+1}月</button>
      <div class="ym-grid">${cells}</div>
    </div>`;
  }

  return `<div class="year-grid">${monthsHtml}</div>`;
}

/* ---------- 7.3 趋势数据与图表 ---------- */
function getSeries(range){
  const today = new Date();
  const out = [];
  if(range === 'year'){
    for(let i = 11; i >= 0; i--){
      const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
      const ym = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
      const vals = state.weights.filter(w => w.date.slice(0,7) === ym).map(w => w.kg);
      out.push({ label:`${d.getMonth()+1}月`, value: vals.length ? avg(vals) : null });
    }
  } else {
    const n = range === 'week' ? 7 : 30;
    for(let i = n - 1; i >= 0; i--){
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      const k = dkey(d);
      const vals = state.weights.filter(w => w.date === k).map(w => w.kg);
      out.push({ label:`${d.getMonth()+1}/${d.getDate()}`, value: vals.length ? avg(vals) : null });
    }
  }
  return out;
}

function buildChart(series){
  const pts = series.filter(p => p.value != null)
                    .map(p => ({ label: p.label, value: toDisplay(p.value) }));
  if(!pts.length) return `<div class="chart-empty">暂无数据<br><span>记录一条体重后即可查看趋势</span></div>`;

  const W = 340, H = 190, pl = 44, pr = 16, pt = 16, pb = 30;
  const iw = W - pl - pr, ih = H - pt - pb;

  let min = Math.min(...pts.map(p => p.value));
  let max = Math.max(...pts.map(p => p.value));
  if(max - min < 1){ const mid = (max + min) / 2; min = mid - 0.5; max = mid + 0.5; }
  const padY = (max - min) * 0.18; min -= padY; max += padY;

  const px = i => pts.length === 1 ? pl + iw/2 : pl + iw * i / (pts.length - 1);
  const py = v => pt + ih * (1 - (v - min) / (max - min));

  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C96B4A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#C96B4A" stop-opacity="0"/>
    </linearGradient></defs>`;

  for(let i = 0; i <= 4; i++){
    const yy = pt + ih * i / 4;
    const v = max - (max - min) * i / 4;
    s += `<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}"
            stroke="#EFE9DC" stroke-width="1"/>`;
    s += `<text x="${pl-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end"
            font-size="10" fill="#B0A797">${v.toFixed(1)}</text>`;
  }

  const co = pts.map((p, i) => [px(i), py(p.value)]);

  s += `<path d="M${co[0][0].toFixed(1)} ${pt+ih} ` +
       co.map(c => `L${c[0].toFixed(1)} ${c[1].toFixed(1)}`).join(' ') +
       ` L${co[co.length-1][0].toFixed(1)} ${pt+ih} Z" fill="url(#ga)"/>`;

  s += `<path d="${co.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ')}"
          fill="none" stroke="#C96B4A" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>`;

  co.forEach(c => {
    s += `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.6"
            fill="#FFFDFA" stroke="#C96B4A" stroke-width="2.2"/>`;
  });

  const step = Math.ceil(pts.length / 5);
  pts.forEach((p, i) => {
    if(i % step === 0 || i === pts.length - 1){
      s += `<text x="${px(i).toFixed(1)}" y="${H-10}" text-anchor="middle"
              font-size="10" fill="#B0A797">${p.label}</text>`;
    }
  });

  return s + `</svg>`;
}

/* ============================================================
   9. 标签拖拽排序
   ============================================================ */
let tabDrag = null;

function setupTabs(){
  const bar = document.getElementById('dtabBar');
  if(!bar) return;
  bar.querySelectorAll('.dtab').forEach(tab => {
    tab.addEventListener('pointerdown', onTabDown);
  });
}

function onTabDown(e){
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  const tab = e.currentTarget;
  const rect = tab.getBoundingClientRect();
  tabDrag = {
    el: tab, startX: e.clientX, startY: e.clientY,
    offsetX: e.clientX - rect.left, w: rect.width,
    moved: false, page: tab.dataset.page, pid: e.pointerId,
  };
  try { tab.setPointerCapture(e.pointerId); } catch(_) {}
  tab.addEventListener('pointermove', onTabMove, { passive:false });
  tab.addEventListener('pointerup', onTabUp);
  tab.addEventListener('pointercancel', onTabUp);
}

function onTabMove(e){
  if(!tabDrag) return;
  const dx = e.clientX - tabDrag.startX;
  const dy = e.clientY - tabDrag.startY;

  if(!tabDrag.moved){
    if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    if(Math.abs(dy) > Math.abs(dx)){ cancelTabDrag(); return; }
    tabDrag.moved = true;
    tabDrag.el.classList.add('dragging');
  }
  if(e.cancelable) e.preventDefault();

  const el = tabDrag.el;
  const bar = el.parentElement;
  const visualLeft = e.clientX - tabDrag.offsetX;

  reorderTabs(el, visualLeft + tabDrag.w / 2);

  const layoutLeft = bar.getBoundingClientRect().left + el.offsetLeft;
  el.style.transform = `translateX(${(visualLeft - layoutLeft).toFixed(1)}px)`;
}

function reorderTabs(el, center){
  const bar = el.parentElement;
  let sib = el.nextElementSibling;
  while(sib){
    const r = sib.getBoundingClientRect();
    if(center > r.left + r.width / 2){
      const next = sib.nextElementSibling;
      bar.insertBefore(sib, el);
      sib = next;
    } else break;
  }
  sib = el.previousElementSibling;
  while(sib){
    const r = sib.getBoundingClientRect();
    if(center < r.left + r.width / 2){
      const prev = sib.previousElementSibling;
      bar.insertBefore(el, sib);
      sib = prev;
    } else break;
  }
}

function cancelTabDrag(){
  if(!tabDrag) return;
  const el = tabDrag.el;
  el.removeEventListener('pointermove', onTabMove);
  el.removeEventListener('pointerup', onTabUp);
  el.removeEventListener('pointercancel', onTabUp);
  el.classList.remove('dragging');
  el.style.transform = '';
  try { el.releasePointerCapture(tabDrag.pid); } catch(_) {}
  tabDrag = null;
}

function onTabUp(){
  if(!tabDrag) return;
  const { el, moved, page } = tabDrag;

  el.removeEventListener('pointermove', onTabMove);
  el.removeEventListener('pointerup', onTabUp);
  el.removeEventListener('pointercancel', onTabUp);
  try { el.releasePointerCapture(tabDrag.pid); } catch(_) {}
  el.classList.remove('dragging');
  el.style.transform = '';
  tabDrag = null;

  if(moved){
    const bar = document.getElementById('dtabBar');
    if(bar){
      state.pageOrder = [...bar.querySelectorAll('.dtab')].map(t => t.dataset.page);
      save();
    }
  } else {
    switchPage(page);
  }
}

  view.date = dkey(d);
  view.wDate = view.date;

    view.year = d.getFullYear();

}
function addMood(key){
  state.moods.push({ id: uid(), date: view.date, time: nowTime(), key });
  save(); render();
}
function saveNote(){
  const el = document.getElementById('noteInput');
  if(!el) return;
  const text = (el.value || '').trim();
  if(!text){ el.focus(); return; }
  state.notes.push({ id: uid(), date: view.date, time: nowTime(), text });
  save(); render();
}
function saveWeight(){
  const input = document.getElementById('wInput');
  if(!input) return;
  const raw = parseFloat(input.value);
  if(!isFinite(raw) || raw <= 0){ input.focus(); return; }

  const kg = Math.round(fromDisplay(raw) * 10) / 10;
  state.weights.push({ id: uid(), date: view.date, time: nowTime(), kg });
  save(); render();
}

function handleSlotClick(mid, idx){
  const mod = state.modules.find(m => m.id === mid);
  if(!mod) return;

  const k = view.date + '|' + mid;
  const cur = state.checks[k] || 0;
  const next = idx < cur ? idx : idx + 1;
  state.checks[k] = next;

  const oldDone = cur  >= mod.target;
  const newDone = next >= mod.target;

  let praiseKind = null;

  if(!oldDone && newDone){
    const full = isDayComplete(view.date);
    if(full && !state.celebrated[view.date]){
      state.celebrated[view.date] = true;
      state.celebratedMods[k] = true;
      praiseKind = 'all';
    } else if(!state.celebratedMods[k]){
      state.celebratedMods[k] = true;
      praiseKind = 'mod';
    }
  } else if(oldDone && !newDone){
    delete state.celebratedMods[k];
    if(state.celebrated[view.date]) delete state.celebrated[view.date];
  }

  save();
  render();
  if(praiseKind) openPraiseModal(praiseKind);
}

/* 全局点击委托 */
app.addEventListener('click', e => {
  const t = e.target;

  const cell = t.closest('[data-date]');
  if(cell){ openDay(cell.dataset.date); return; }

  const dayNav = t.closest('[data-daynav]');
  if(dayNav){ shiftDay(+dayNav.dataset.daynav); return; }

  const nav = t.closest('[data-nav]');
  if(nav){ shiftMonth(+nav.dataset.nav); return; }

  const actEl = t.closest('[data-act]');
  if(actEl){
    const act = actEl.dataset.act;

    if(act === 'today'){
      const n = new Date();
      view.year = n.getFullYear();
      if(view.calMode === 'month') view.month = n.getMonth();
      render();

    } else if(act === 'goto-today'){
      view.date = TODAY();
      view.wDate = TODAY();
      view.showAddMod = false;
      render(true);

    } else if(act === 'open-weight'){
      view.name = 'day';
      view.date = TODAY();
      view.wDate = TODAY();
      view.page = 'weight';
      view.showAddMod = false;
      render(true);

    } else if(act === 'save-weight'){
      saveWeight();

    } else if(act === 'save-note'){
      saveNote();

    } else if(act === 'toggle-order'){
      state.timelineOrder = state.timelineOrder === 'asc' ? 'desc' : 'asc';
      save(); render();

    } else if(act === 'add-mod'){
      view.showAddMod = true; render();

    } else if(act === 'cancel-mod'){
      view.showAddMod = false; render();

    } else if(act === 'confirm-mod'){
      const nameEl = document.getElementById('modName');
      const tgtEl  = document.getElementById('modTarget');
      const name = (nameEl.value || '').trim();
      const target = Math.max(1, Math.min(12, parseInt(tgtEl.value, 10) || 1));
      if(!name){ nameEl.focus(); return; }
      state.modules.push({
        id: uid(),
        name,
        icon: view.newIcon || '💧',
        target,
        createdDate: view.date,
        deletedDate: null,
      });
      view.showAddMod = false;
      view.newIcon = '💧';
      save(); render();
    }
    return;
  }

  const cvBtn = t.closest('[data-calview]');
  if(cvBtn){
    const mode = cvBtn.dataset.calview;
    if(view.calMode !== mode){
      view.calMode = mode;
      render();
    }
    return;
  }

  const ymBtn = t.closest('[data-ym]');
  if(ymBtn){
    view.month = +ymBtn.dataset.ym;
    view.calMode = 'month';
    render(true);
    return;
  }

  if(t.closest('[data-back]')){
    view.name = 'calendar';
    render(true);
    return;
  }

  const moodBtn = t.closest('[data-mood]');
  if(moodBtn){ addMood(moodBtn.dataset.mood); return; }

  const delMood = t.closest('[data-del-mood]');
  if(delMood){
    state.moods = state.moods.filter(x => x.id !== delMood.dataset.delMood);
    save(); render(); return;
  }

  const delNote = t.closest('[data-del-note]');
  if(delNote){
    state.notes = state.notes.filter(n => n.id !== delNote.dataset.delNote);
    save(); render(); return;
  }

  const editW = t.closest('[data-edit-weight]');
  if(editW){ openWeightEditModal(editW.dataset.editWeight); return; }

  const delW = t.closest('[data-del-weight]');
  if(delW){ openWeightDeleteModal(delW.dataset.delWeight); return; }

  const unitBtn = t.closest('[data-unit]');
  if(unitBtn){
    state.unit = unitBtn.dataset.unit;
    save(); render(); return;
  }

  const rangeBtn = t.closest('[data-range]');
  if(rangeBtn){
    view.statRange = rangeBtn.dataset.range;
    refreshWeightChart();
    return;
  }

  const slot = t.closest('.slot[data-mod]');
  if(slot){
    handleSlotClick(slot.dataset.mod, +slot.dataset.idx);
    return;
  }

  const delMod = t.closest('[data-del-mod]');
  if(delMod){
    openDeleteModuleModal(delMod.dataset.delMod);
    return;
  }

  const emo = t.closest('[data-emo]');
  if(emo){
    view.newIcon = emo.dataset.emo;
    document.querySelectorAll('.emo').forEach(b =>
      b.classList.toggle('on', b.dataset.emo === view.newIcon));
    return;
  }
});

app.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.id === 'wInput'){
    e.preventDefault(); saveWeight();
  }
  if(e.key === 'Enter' && e.target.id === 'noteInput' && !e.shiftKey){
    e.preventDefault(); saveNote();
  }
});

/* 启动 */
render(true);
</script>
